name: Code Verification

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  code-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate lockfile
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: node --run lint

      # - name: Run Tests
      #   run: npm run test
