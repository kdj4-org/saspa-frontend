name: Code Verification

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  code-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and generate lock file
        run: |
          echo "Checking if lock file exists..."
          if [ ! -f package.json ]; then
            echo "Error: package.json not found. Cannot install dependencies."
            exit 1
          fi

          if [ ! -f package-lock.json ]; then
            echo "package-lock.json not found. Generating it now..."
            npm install --package-lock-only || exit 1
          fi

          echo "Installing dependencies..."
          npm ci --no-audit --no-fund || exit 1

      - name: Run Lint
        run: npm run lint